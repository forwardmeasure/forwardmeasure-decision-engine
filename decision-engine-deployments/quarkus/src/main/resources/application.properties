quarkus.grpc.server.port=9000
# quarkus.datasource.* is now used only as the Hibernate "bootstrap"/admin connection (Quarkus's own
# build-time Hibernate ORM augmentation needs a default datasource configured for dialect resolution)
# - never real tenant data access. Real per-tenant data access is routed through
# forwardmeasure.jpa.tenant-database below (one physical database per tenant), via
# QuarkusTenantConnectionResolver (forwardmeasure-jpa-quarkus).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DECISION_ENGINE_DATABASE_URL}
quarkus.datasource.username=${DECISION_ENGINE_DATABASE_USERNAME}
quarkus.datasource.password=${DECISION_ENGINE_DATABASE_PASSWORD}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.packages=com.forwardmeasure.jpa.identity.entity,com.forwardmeasure.jpa.locking.entity,com.forwardmeasure.jpa.asynctask.entity,com.forwardmeasure.jpa.core.entity,com.forwardmeasure.decisionengine.jpa.entity
# DATABASE (not SCHEMA) - QuarkusTenantConnectionResolver implements Quarkus's TenantConnectionResolver
# SPI, which Quarkus only consults under the DATABASE multitenancy strategy (confirmed by decompiling
# io.quarkus.hibernate.orm.runtime.migration.MultiTenancyStrategy in quarkus-hibernate-orm 3.39.1 -
# HibernateMultiTenantConnectionProvider.getAnyConnectionProvider resolves a TenantResolver bean either
# way, but the per-tenant ConnectionProvider path via TenantConnectionResolver is DATABASE-strategy
# specific). Each tenant gets its own physical database (TenantDataSourceRegistry), not just a
# schema-switch within one shared connection pool.
quarkus.hibernate-orm.multitenant=DATABASE
# Real multi-tenant JPA bootstrap (forwardmeasure-jpa-quarkus): database-per-tenant, schema-per-product.
# DECISION_ENGINE_DATABASE_HOST/PORT are new - the existing DECISION_ENGINE_DATABASE_URL/USERNAME/
# PASSWORD env vars carry a full JDBC URL, but TenantDataSourceRegistry needs host/port broken out
# separately to build one JDBC URL per tenant database; username/password are reused unchanged (same
# Postgres instance/credentials).
forwardmeasure.jpa.functional-schema=decision_intelligence
forwardmeasure.jpa.tenant-database.host=${DECISION_ENGINE_DATABASE_HOST}
forwardmeasure.jpa.tenant-database.port=${DECISION_ENGINE_DATABASE_PORT:5432}
forwardmeasure.jpa.tenant-database.username=${DECISION_ENGINE_DATABASE_USERNAME}
forwardmeasure.jpa.tenant-database.password=${DECISION_ENGINE_DATABASE_PASSWORD}
decision-engine.valkey.host=${DECISION_ENGINE_VALKEY_HOST}
decision-engine.valkey.port=${DECISION_ENGINE_VALKEY_PORT:6379}
decision-engine.valkey.password=${DECISION_ENGINE_VALKEY_PASSWORD:}
# trusting (default) is correct only for today's internal-only (ClusterIP) deployment - callers (e.g.
# forwardmeasure-agent-os) have already resolved real tenant identity upstream through their own
# verified flow. verified is for a future standalone deployment - see VerifiedJwtTenantResolver's own
# javadoc. Deliberate, already-made decision this session.
decision-engine.tenant-resolution.mode=${DECISION_ENGINE_TENANT_RESOLUTION_MODE:trusting}
decision-engine.tenant-resolution.jwks-uri=${DECISION_ENGINE_TENANT_RESOLUTION_JWKS_URI:}
decision-engine.tenant-resolution.issuer=${DECISION_ENGINE_TENANT_RESOLUTION_ISSUER:}
decision-engine.tenant-resolution.organization-client-id=${DECISION_ENGINE_TENANT_RESOLUTION_ORGANIZATION_CLIENT_ID:}

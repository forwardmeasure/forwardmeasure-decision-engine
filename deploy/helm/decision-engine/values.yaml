# ---------------------------------------------------------------------------
# values.yaml — Decision Engine Helm chart defaults
#
# One chart, parameterized by which framework binding's image it runs (image.repository picks
# decision-engine-quarkus / decision-engine-spring / decision-engine-micronaut) - the Deployment/
# Service/ServiceAccount/gRPC-health-probe shape is identical regardless of framework, mirroring
# the opa-helm-chart's own structure from the parallel OPA investigation (forwardmeasure/
# helm-charts/charts/opa-helm-chart). templates/ is intentionally not yet populated here - build it
# from that chart's own _helpers.tpl/deployment.yaml/service.yaml/service-account.yaml as the direct
# template, adjusted for gRPC's port and for this chart needing a real Postgres connection (unlike
# stateless OPA).
# ---------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: docker.io/forwardmeasure/decision-engine-quarkus
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: docker-io-credentials

service:
  type: ClusterIP
  # Matches Quarkus's own gRPC default. No established convention to follow here otherwise - see
  # IMPLEMENTATION-SPEC.md Section 9.1.
  grpcPort: 9000

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 768Mi

# ---------------------------------------------------------------------------
# Ruleset-definition database (Postgres) - decision-engine-jpa, Section 7.3. Runtime credential
# only; the administrator credential belongs to decision-engine-database-migration-service's own
# Job, run separately (see deploy/helmfile).
# ---------------------------------------------------------------------------
database:
  url: ""
  credentialsSecret: decision-engine-database-credentials

# ---------------------------------------------------------------------------
# Fact-window store (Valkey) - decision-engine-fact-window, Section 7.4. See Section 9.1/9.2 for
# how the "embedded" vs "external" mode is actually resolved at the helmfile layer - this chart
# itself only ever sees a plain host:port, never anything about how that Valkey came to exist.
# ---------------------------------------------------------------------------
factWindow:
  valkey:
    host: ""
    port: 6379
    credentialsSecret: ""

podAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

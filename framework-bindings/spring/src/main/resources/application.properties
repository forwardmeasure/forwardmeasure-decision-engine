server.port=8080
spring.grpc.server.port=9000
spring.grpc.server.enabled=true
spring.datasource.url=${DECISION_ENGINE_DATABASE_URL}
spring.datasource.username=${DECISION_ENGINE_DATABASE_USERNAME}
spring.datasource.password=${DECISION_ENGINE_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
decision-engine.valkey.host=${DECISION_ENGINE_VALKEY_HOST}
decision-engine.valkey.port=${DECISION_ENGINE_VALKEY_PORT:6379}
decision-engine.valkey.password=${DECISION_ENGINE_VALKEY_PASSWORD:}

syntax = "proto3";

package forwardmeasure.decisionengine.v1;

option java_package = "com.forwardmeasure.decisionengine.contract.v1";
option java_multiple_files = true;

// Operational controls are local to the serving process. They do not mutate persisted rulesets or
// Valkey fact windows. Access must be restricted by the deployment environment.
service DecisionEngineAdminService {
  rpc GetStatistics(GetStatisticsRequest) returns (RuntimeStatistics);
  rpc GetCacheStatus(GetCacheStatusRequest) returns (CacheStatus);
  rpc UnloadRuleset(UnloadRulesetRequest) returns (CacheStatus);
  rpc ClearCompiledRulesCache(ClearCompiledRulesCacheRequest) returns (CacheStatus);
  rpc WarmRuleset(WarmRulesetRequest) returns (CacheStatus);
}

message GetStatisticsRequest {}

message RuntimeStatistics {
  int64 invocation_count = 1;
  int64 success_count = 2;
  int64 failure_count = 3;
  int64 cache_hit_count = 4;
  int64 cache_miss_count = 5;
  int64 cache_eviction_count = 6;
  int64 total_evaluation_nanos = 7;
  int64 total_compilation_nanos = 8;
}

message GetCacheStatusRequest {}

message CacheStatus {
  int32 capacity = 1;
  int32 size = 2;
  repeated CacheEntry entries = 3;
}

message CacheEntry {
  string ruleset = 1;
  int64 version = 2;
}

message UnloadRulesetRequest {
  string ruleset = 1;
  int64 version = 2;
}

message ClearCompiledRulesCacheRequest {}

message WarmRulesetRequest {
  string ruleset = 1;
  int64 version = 2;
}
